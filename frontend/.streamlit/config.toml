[theme]
primaryColor = "#4A9EFF"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#141824"
textColor = "#ffffff"
font = "sans serif"

[server]
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = false
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "viewer"
