[theme]
primaryColor = "#3b82f6"
backgroundColor = "#060912"
secondaryBackgroundColor = "#0c1020"
textColor = "#e2e8f0"
font = "sans serif"

[server]
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = false
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
