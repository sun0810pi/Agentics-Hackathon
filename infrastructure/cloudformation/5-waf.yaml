AWSTemplateFormatVersion: '2010-09-09'
Description: AgentFlow - WAF Web ACL

Parameters:
  ApiArn: { Type: String }

Resources:
  AgentFlowWAF:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: agentflow-waf
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRules
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: SQLiRules
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: AgentFlowWAF
